name: Deploy Frontend to GitHub Pages

# Deploys the React frontend only. The FastAPI backend cannot run on GitHub
# Pages (it serves static files) — host it separately and point the frontend at
# it via the VITE_API_BASE_URL repository variable.
#
# Set it once: Settings -> Secrets and variables -> Actions -> Variables ->
#   New repository variable
#   Name:  VITE_API_BASE_URL
#   Value: https://api.placementmantra.shop   (no trailing slash)
#
# Served from the custom domain placementmantra.shop, configured under
# Settings -> Pages -> Custom domain, with GoDaddy DNS pointed at GitHub
# Pages (see README for the exact records).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Fail early if the API URL is not configured
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::error::VITE_API_BASE_URL repository variable is not set."
            echo "The build would produce a site whose every API call fails."
            echo "Set it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Optional - unset hides the "Sign in with Google" button. Must
          # match the backend's GOOGLE_CLIENT_ID.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        # No VITE_BASE_PATH: the site is served from a custom domain's root
        # (placementmantra.shop), not the /<repo>/ subpath a github.io project
        # site would use. vite.config.ts already defaults base to '/'.
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
