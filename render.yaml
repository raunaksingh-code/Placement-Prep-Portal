# Render blueprint. Create the service by pointing Render at this repo
# (New -> Blueprint), then set CORS_ORIGINS and DATABASE_URL in the dashboard.
#
# The database is NOT Render's own Postgres - Render's free Postgres tier
# auto-deletes the database (not just spins it down) after a fixed window,
# which is what happened before. DATABASE_URL instead points at a free Neon
# project (neon.tech), which suspends compute on idle but never deletes data.
services:
  - type: web
    name: placement-prep-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations and seeding both run here rather than in preDeployCommand or a
    # shell session, neither of which is available on the free plan. Both are
    # idempotent - alembic skips applied revisions, and the seeder checks for
    # existing rows before inserting - so re-running on every boot is safe.
    startCommand: alembic upgrade head && python -m app.seed.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Pin the interpreter. Render otherwise defaults to its current Python,
      # and several pinned dependencies (bcrypt 4.0.1, passlib 1.7.4,
      # python-jose 3.3.0) have no wheels for 3.13 and fail to build.
      # This is the version the app was developed and tested against.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      # The JD and question-bank modules expose confidential material, so only
      # institute addresses may register.
      - key: ALLOWED_EMAIL_DOMAINS
        value: greatlakes.edu.in
      - key: SECRET_KEY
        generateValue: true
      # Connection string from a Neon project (neon.tech) - see README for
      # how to create one. Format:
      #   postgresql://<user>:<password>@<host>/<dbname>?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Set this to your GitHub Pages URL once the frontend is deployed,
      # e.g. https://raunaksingh-code.github.io
      - key: CORS_ORIGINS
        sync: false
      # OAuth client ID from the Google Cloud Console. Must match the
      # frontend's VITE_GOOGLE_CLIENT_ID. Leave unset to hide the Google
      # sign-in button.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Comma-separated emails to promote to admin on their next sign-in.
      # Only needed to bootstrap the first admin - after that, admins are
      # managed from the admin page.
      - key: ADMIN_EMAILS
        sync: false
      # Powers the AI Coach features (ATS grader, mock interview/GD, chatbot).
      # Get a key from https://aistudio.google.com/apikey. Without it, those
      # endpoints fall back to a fixed mock response.
      - key: GEMINI_API_KEY
        sync: false
