# Render blueprint. Create the services by pointing Render at this repo
# (New -> Blueprint), then set SECRET_KEY and CORS_ORIGINS in the dashboard.
services:
  - type: web
    name: placement-prep-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run in the start command rather than preDeployCommand, which is
    # not available on the free plan. `alembic upgrade head` is idempotent, so
    # running it on every boot is safe.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: placement-prep-db
          property: connectionString
      # Set this to your GitHub Pages URL once the frontend is deployed,
      # e.g. https://raunaksingh-code.github.io
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: placement-prep-db
    plan: free
    databaseName: placementprep
