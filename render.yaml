# Render blueprint. Create the services by pointing Render at this repo
# (New -> Blueprint), then set SECRET_KEY and CORS_ORIGINS in the dashboard.
services:
  - type: web
    name: placement-prep-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations and seeding both run here rather than in preDeployCommand or a
    # shell session, neither of which is available on the free plan. Both are
    # idempotent - alembic skips applied revisions, and the seeder checks for
    # existing rows before inserting - so re-running on every boot is safe.
    startCommand: alembic upgrade head && python -m app.seed.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Pin the interpreter. Render otherwise defaults to its current Python,
      # and several pinned dependencies (bcrypt 4.0.1, passlib 1.7.4,
      # python-jose 3.3.0) have no wheels for 3.13 and fail to build.
      # This is the version the app was developed and tested against.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: placement-prep-db
          property: connectionString
      # Set this to your GitHub Pages URL once the frontend is deployed,
      # e.g. https://raunaksingh-code.github.io
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: placement-prep-db
    plan: free
    databaseName: placementprep
